services:
  huguette:
    image: ghcr.io/hug-efrei/huguette:latest
    build: .
    container_name: huguette
    restart: unless-stopped
    ports:
      # 0.0.0.0 : le reverse proxy n'est pas sur cet hôte Docker, il doit
      # atteindre ce port via le LAN. Restreins-le en amont (pare-feu/VLAN),
      # pas ici, sinon le reverse proxy ne peut plus joindre le conteneur.
      - "8000:8000"
    env_file:
      - .env
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
