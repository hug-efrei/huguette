name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest

      - name: Smoke test
        run: |
          PROWLARR_API_KEY=ci QBIT_USERNAME=ci QBIT_PASSWORD=ci \
            uvicorn main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 10); do
            curl -sf http://127.0.0.1:8000/api/config && break || sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/config || { echo "App unreachable"; exit 1; }
