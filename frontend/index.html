<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Huguette — Bibliothécaire Numérique</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="scanlines" aria-hidden="true"></div>

  <!-- ══ HEADER ══════════════════════════════════════════════ -->
  <header class="site-header">
    <div class="avatar-wrap">
      <canvas id="avatar-canvas" width="96" height="96"></canvas>
    </div>

    <div class="header-info">
      <h1 class="site-title">HUGUETTE</h1>
      <p class="site-sub">Bibliothécaire Numérique</p>
      <div class="status-badge">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-label" id="status-label">CONNEXION…</span>
      </div>
    </div>

    <nav class="header-nav">
      <button class="nav-btn active" id="tab-search">RECHERCHE</button>
      <button class="nav-btn" id="tab-downloads">TELECHARGEMENTS</button>
      <a class="nav-btn nav-btn-library" id="btn-library" target="_blank" rel="noopener" hidden>LIBRAIRIE</a>
    </nav>
  </header>

  <!-- ══ MAIN ════════════════════════════════════════════════ -->
  <main>

    <!-- ── Dialogue Huguette ──────────────────────────────── -->
    <section class="dialogue-section">
      <div class="dialogue-box" id="dialogue-box">
        <span id="dialogue-text">Bonjour ! Je suis Huguette, votre bibliothécaire numérique. Que puis-je vous trouver aujourd'hui ?</span>
        <span class="dialogue-arrow" id="dialogue-arrow">▼</span>
      </div>
    </section>

    <!-- ── Onglet Recherche ────────────────────────────────── -->
    <section class="tab-panel" id="panel-search">

      <div class="search-bar">
        <label class="search-label" for="search-input">📚</label>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Titre, auteur, ISBN…"
          autocomplete="off"
          spellcheck="false"
        />
        <button class="btn-primary" id="search-btn">CHERCHER</button>
      </div>

      <div id="results-area" hidden>
        <div class="results-header">
          <span id="results-count" class="label-tag"></span>
          <div class="sort-group">
            <span class="sort-label">TRIER :</span>
            <button class="sort-btn" data-sort="seeders">🌱 DISPO</button>
            <button class="sort-btn" data-sort="size">⚖ TAILLE</button>
            <button class="sort-btn" data-sort="title">🔤 TITRE</button>
            <button class="sort-btn" data-sort="year">📅 DATE</button>
          </div>
        </div>
        <div class="results-list" id="results-grid"></div>
      </div>

      <div id="empty-state" class="empty-state" hidden>
        <p>Aucun résultat trouvé.<br/>Huguette a cherché partout…</p>
      </div>
    </section>

    <!-- ── Onglet Téléchargements ─────────────────────────── -->
    <section class="tab-panel" id="panel-downloads" hidden>
      <div class="dl-controls">
        <span class="sort-label">TRIER :</span>
        <button class="sort-btn active" id="dl-sort-date">📅 DATE</button>
        <button class="sort-btn" id="dl-sort-name">🔤 NOM</button>
        <button class="sort-btn" id="dl-sort-progress">📊 AVANCEMENT</button>
      </div>
      <div class="dl-list" id="dl-list">
        <p class="dl-empty">Aucune acquisition en cours.</p>
      </div>
    </section>

  </main>

  <!-- ══ TOAST ═══════════════════════════════════════════════ -->
  <div class="toast" id="toast" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
